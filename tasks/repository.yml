# tasks file
---
- name: repository | dependencies (pre)
  ansible.builtin.apt:
    name: "{{ new_relic_servers_dependencies_pre }}"
    state: "{{ apt_install_state | default('latest') }}"
    update_cache: true
    cache_valid_time: "{{ apt_update_cache_valid_time | default(3600) }}"
  tags:
    - new-relic-servers-repository-dependencies-pre

- name: repository | add public key
  ansible.builtin.apt_key:
    id: 2DAD550E
    url: https://download.newrelic.com/NEWRELIC_APT_2DAD550E.public
    state: present
  tags:
    - new-relic-servers-repository-public-key

- name: repository | add
  ansible.builtin.apt_repository:
    repo: "{{ item.type }} {{ item.url }} {{ item.component }}"
    state: present
    update_cache: true
    mode: '0644'
  with_items: "{{ new_relic_servers_repositories }}"
  tags:
    - new-relic-servers-repository-add
